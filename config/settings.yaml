# ==============================================================
#   QUICK SETUP — edit these lines, ignore everything below
# ==============================================================

model: gemma:7b        # your AI model (see: python main.py models)
channel: ""            # your channel, e.g. "@YourHandle"

content_language: auto # language of the streams you clip: auto = detect per
                       # video (fine for most). Force a code (es / pt / hi /
                       # id / en ...) if bilingual streams get transcribed in
                       # the wrong language — captions burn in this language.

auto_upload: false     # true = post Shorts to YouTube automatically
                       # (needs one-time setup: README "Enable uploads")
                       # NOTE: this is the command-line daemon only. To publish
                       # from the editor instead, turn on Settings -> Publish
                       # to YouTube; it ignores both of these keys.

privacy: public        # public / unlisted / private for posted Shorts.
                       # NOTE: until your API project passes YouTube's free
                       # audit, YouTube locks API uploads to private whatever
                       # this says — permanently, and it cannot be undone in
                       # Studio. See README "Posting publicly".

# ==============================================================
#   Advanced settings — defaults are fine for most people
# ==============================================================

# Extra channels beyond the one above (handles, URLs, or IDs),
# or use:  python main.py channels add @SomeHandle
channels: []

poll_interval_minutes: 15

llm:
  # Translation (multilingual publishing) can use a DIFFERENT local model
  # than clipping. Clipping models are picked for judgement; translation
  # wants multilingual strength, where the Qwen line is markedly better than
  # gemma — qwen3:8b, or qwen3:14b if it fits. Both are Apache-2.0, which
  # matters if you earn from the clips. qwen2.5:7b remains a smaller option.
  # Empty = use the main model above. Install it from the Models page;
  # nothing is downloaded until you ask.
  translation_model: ""
  temperature: 0.4
  num_ctx: 8192          # context window; raise for models that support more
  ollama_host: http://localhost:11434

whisper:
  model: auto           # auto = large-v3-turbo on GPU, small on CPU. Or force:
                        # tiny / base / small / medium / large-v3 / large-v3-turbo
  device: auto          # cuda if available, else cpu

# Where transcription runs. "local" is Whisper on this PC (the settings above),
# the default. Or send the audio, on YOUR OWN API key, to a provider that
# returns word timings: openai / openrouter / xai. Set it in Settings → AI.
transcription:
  backend: local
  model: ""

clips:
  compilation: false          # true = compilation mode (unlimited clips, cut-bounded gags, post-climax follow-through)
  recap: false                # true = recap mode (tutorials/walkthroughs stitched into single recap.mp4)
  video_to_clips: false       # true = video to clips (2-3 min batches, part_01.mp4, etc.)
  min_score: 55         # discard candidates scored below this (0-100).
                        # Higher = fewer, better clips. Kept generous on
                        # purpose: creators pick what to post — a ~2h stream
                        # should yield ~50 clips to choose from.
  max_clips_per_video: 0  # 0 = automatic: keep every clip that passes min_score
  min_duration: 10      # seconds — clips land on sentence boundaries, so real
  max_duration: 60      # lengths vary naturally across this 10-60s range
                        # (turn on the 60s+ toggle for TikTok-length clips)
  vertical: true        # true 9:16 1080x1920 with YOLOv8 subject tracking
  captions: true        # burn word-synced captions into the clips
  outro: false          # append the 2.9s Clips Kitty end card to each clip.
                        # Off by default; Settings > Branding turns it on.
                        # Stream-copied, so the clip is never re-encoded.
                        # Absent counts as false.

scoring:
  # Multimodal fusion weights (must sum to 1.0). Raise audio/visual for
  # gameplay/stream content; raise text for talking-head/educational content.
  weights:
    text: 0.30
    visual: 0.20
    reaction: 0.20
    audio: 0.20
    engagement: 0.10
  signal_peak_percentile: 85   # how unusual a moment must be to become a candidate
  creator_context_max: 6       # max score bonus for creator-knowledge callbacks
                               # (ongoing storylines, catchphrases, collaborators).
                               # Additive-only and capped so learned knowledge can
                               # never DEGRADE scores. 0 disables entirely.
  action_bonus: 10             # score bonus for active-content clips (workouts,
                               # sports, dance): a person on-screen and moving
                               # (whether or not they're talking). Surfaces this
                               # content, which performs on social but which the
                               # scorer under-credits. Raise for MORE such clips,
                               # 0 to disable.
  audience_bonus: 8            # max score bonus from real audience data: Twitch
                               # chat replay speed (unique chatters, so gifted-sub
                               # spam doesn't count) and YouTube's most-replayed
                               # heatmap. Only the very top of the curve earns it;
                               # kept below action_bonus so the video's own content
                               # stays the main signal. 0 disables. (Kick keeps no
                               # chat after a stream ends, so Kick has no chat data.)
  rerank_pool: 8               # finalists compared head-to-head by the LLM
  reaction_top_k: 8            # candidates that get the (slower) YOLO reaction pass

visual_analysis:
  enabled: true
  interval_seconds: 3.0   # sample every N seconds + extra frames on visual peaks/cuts
  max_frames: 120         # cap sampled frames so analysis remains fast
  model: ""               # empty = active vision model, or fallback to gemma4:e4b if main LLM has no vision

compilation_mode:
  visual_analysis: true
  max_clips: 0            # no hard upper bound; export all qualifying action clips (4 or 100+)
  min_duration: 25.0      # coherent compilation segments (25-90s)
  max_duration: 90.0
  min_score_offset: -20   # lower threshold so almost every action moment is captured
  merge_gap_seconds: 18.0 # merge consecutive highlights within 18s into one continuous clip
  pre_climax_seconds: 4.5 # start at least 4.5s before the first action highlight
  post_climax_seconds: 6.5 # play at least 6.5s after the last action highlight

recap_mode:
  visual_analysis: true
  min_duration: 5.0       # tutorial steps 5-20s
  max_duration: 20.0
  pre_climax_seconds: 2.5 # 2.5s lead-in
  post_climax_seconds: 3.0 # 3.0s follow-through
  merge_gap_seconds: 6.0
  min_score_offset: -15
  output_file: recap.mp4

video_to_clips_mode:
  visual_analysis: true
  min_duration: 15.0      # individual highlight clips within batches
  max_duration: 60.0
  pre_climax_seconds: 3.5 # 3.5s lead-in
  post_climax_seconds: 5.0 # 5.0s follow-through
  merge_gap_seconds: 12.0 # merge consecutive highlights within 12s
  target_part_duration_min: 120.0 # 2-3 minute batches (120-180s)
  target_part_duration_max: 180.0
  frame_interval_seconds: 8.0 # dynamic frame sampling for long videos
  max_frames: 1200        # scan up to 90+ min videos
  min_score_offset: -20

analysis:
  # Duplicate prevention thresholds
  max_overlap: 0.4            # reject >40% timestamp overlap with a kept clip
  max_text_similarity: 0.7    # reject >70% transcript similarity with a kept clip
  max_segment_reuse: 0.4      # reject if >40% of transcript segments already used
  # Long-video chunking. Sized for a 7B model's 8K context: ~5 minutes of
  # speech per chunk leaves the model ample room to think and respond.
  # Models with bigger contexts can raise chunk_seconds and llm.num_ctx together.
  chunk_seconds: 300
  chunk_overlap_seconds: 45
  long_video_threshold_seconds: 420

video:
  encoder: auto          # auto = first working GPU encoder (NVIDIA nvenc /
                         # AMD amf / Intel qsv), else CPU. Or force one:
                         # "nvenc" / "amf" / "qsv" / "cpu"
  parallel_renders: 3    # clips rendered at once (one's GPU tracking overlaps
                         # another's NVENC encode). Sized for ~6 CPU cores /
                         # 16GB RAM; raise only with more RAM + spare VRAM.

tracking:
  detector: yolov8n-pose.pt  # pose model: head keypoints (nose/eyes/ears) give
                             # head-priority framing even when no face is
                             # visible. Auto-downloaded by ultralytics.
  sample_fps: 8          # detection sampling rate (higher = tighter tracking)

upload:
  # Both keys belong to the command-line daemon (`python main.py upload`).
  # Publishing from the editor uses your own key, set up in Settings, and is
  # capped by YouTube rather than by anything here.
  daily_limit: 6         # hard cap on Shorts scheduled per calendar day.
                         # Sized for the OLD quota model, where one upload cost
                         # 1,600 of a shared 10,000 units a day. Since June 2026
                         # videos.insert has its own bucket of 100 uploads a day
                         # per Google Cloud project, so this is now a self-imposed
                         # pacing limit, not a technical one.
  client_secret: config/client_secret.json   # from Google Cloud Console

feedback:
  # Where the in-app Feedback Hub sends reports (a Cloudflare Worker that
  # files them as GitHub Issues — users need no account; see
  # feedback-relay/README.md to deploy). Empty = reports save to a file.
  relay_url: "https://clips-studio-feedback.clipsstudio.workers.dev"

paths:
  data_dir: data
